services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: preploop
      POSTGRES_USER: prep
      POSTGRES_PASSWORD: prep_dev_pass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prep -d preploop"]
      interval: 5s
      timeout: 5s
      retries: 10

  vault:
    image: hashicorp/vault:latest
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: http://127.0.0.1:8200
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    command: server -dev
    healthcheck:
      test: ["CMD-SHELL", "vault status -address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  vault-init:
    image: hashicorp/vault:latest
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
    depends_on:
      vault:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        vault kv put secret/backend-core \
          jwt.secret=dev-jwt-secret-change-in-prod-min32chars \
          spring.datasource.password=prep_dev_pass
        echo "Vault seeded"
    restart: "no"

  core:
    build:
      context: ./backend-core
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_CLOUD_VAULT_TOKEN: root
      SPRING_CLOUD_VAULT_HOST: vault
      SPRING_CLOUD_VAULT_PORT: 8200
      SPRING_CLOUD_VAULT_SCHEME: http
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: preploop
      DB_USER: prep
      STORAGE_ROOT: /app/files
      APP_SEED_EMAIL: admin@preploop.local
      APP_SEED_PASSWORD: changeme
    depends_on:
      postgres:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
