services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: preploop
      POSTGRES_USER: prep
      POSTGRES_PASSWORD: prep_dev_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prep -d preploop"]
      interval: 5s
      timeout: 5s
      retries: 10

  vault:
    image: hashicorp/vault:latest
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: http://127.0.0.1:8200
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    command: server -dev
    healthcheck:
      test: ["CMD-SHELL", "vault status -address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  vault-init:
    image: hashicorp/vault:latest
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
    depends_on:
      vault:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        vault kv put secret/backend-core \
          jwt.secret=dev-jwt-secret-change-in-prod-min32chars \
          spring.datasource.password=prep_dev_pass \
          ai.service.token=dev-inter-service-token-change-in-prod
        vault kv put secret/ai-service \
          db.password=prep_dev_pass \
          service.token=dev-inter-service-token-change-in-prod \
          anthropic.api_key=${ANTHROPIC_API_KEY:-REPLACE_WITH_REAL_KEY} \
          voyage.api_key=${VOYAGE_API_KEY:-REPLACE_WITH_REAL_KEY} \
          openai.api_key=${OPENAI_API_KEY:-REPLACE_WITH_REAL_KEY} \
          gemini.api_key=${GEMINI_API_KEY:-REPLACE_WITH_REAL_KEY} \
          aws.access_key_id=${AWS_ACCESS_KEY_ID:-REPLACE_WITH_REAL_KEY} \
          aws.secret_access_key=${AWS_SECRET_ACCESS_KEY:-REPLACE_WITH_REAL_KEY} \
          aws.region=${AWS_REGION:-us-east-1}
        echo "Vault seeded"
    restart: "no"

  ai:
    build:
      context: ./ai-service
    ports:
      - "8000:8000"
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
      CORE_URL: http://core:8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: preploop
      DB_USER: prep
    depends_on:
      postgres:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  core:
    build:
      context: ./backend-core
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_CLOUD_VAULT_TOKEN: root
      SPRING_CLOUD_VAULT_HOST: vault
      SPRING_CLOUD_VAULT_PORT: 8200
      SPRING_CLOUD_VAULT_SCHEME: http
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: preploop
      DB_USER: prep
      STORAGE_ROOT: /app/files
      APP_SEED_EMAIL: admin@preploop.local
      APP_SEED_PASSWORD: changeme
      AI_SERVICE_URL: http://ai:8000
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      core:
        condition: service_healthy

volumes:
  postgres_data:
