spring:
  application:
    name: backend-core
  config:
    import: optional:vault://
  cloud:
    vault:
      scheme: http
      authentication: TOKEN
      kv:
        enabled: true
        backend: secret
        default-context: backend-core
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:preploop}
    username: ${DB_USER:prep}
    # password injected from Vault key: spring.datasource.password
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${jwt.secret}
    access-token-expiry-ms: 900000
    refresh-token-expiry-ms: 604800000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
    service-token: ${ai.service.token:dev-service-token}
  storage:
    local-root: ${STORAGE_ROOT:${user.home}/.preploop/files}
  gmail:
    enabled: ${GMAIL_ENABLED:false}
    # OAuth client + refresh token come from Vault (secret/backend-core) — never from config
    client-id: ${gmail.client.id:}
    client-secret: ${gmail.client.secret:}
    refresh-token: ${gmail.refresh.token:}
    # when set, only mail the user routed to this Gmail label is ever fetched;
    # otherwise a sender allowlist of job boards/ATS domains is used
    label: ${GMAIL_LABEL:}
    lookback-days: 7
    max-results: 25
    poll-interval-ms: 1800000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
