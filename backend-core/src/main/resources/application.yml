spring:
  application:
    name: backend-core
  config:
    import: optional:vault://
  cloud:
    vault:
      scheme: http
      authentication: TOKEN
      kv:
        enabled: true
        backend: secret
        default-context: backend-core
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:preploop}
    username: ${DB_USER:prep}
    # password injected from Vault key: spring.datasource.password
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${jwt.secret}
    access-token-expiry-ms: 900000
    refresh-token-expiry-ms: 604800000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
    service-token: ${ai.service.token:dev-service-token}
  storage:
    local-root: ${STORAGE_ROOT:${user.home}/.preploop/files}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
