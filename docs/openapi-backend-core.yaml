openapi: 3.0.3

info:
  title: prep-loop — backend-core API
  version: "2.0.0"
  description: |
    The UI-facing REST API of **backend-core** (Java 21 / Spring Boot 3.3). It is the system
    of record: auth, all CRUD, transactions, the feedback-loop rule, Gmail ingestion, and the
    AI gateway + budget guard.

    The React frontend talks **only** to this service. `ai-service` (Python/FastAPI, port 8000)
    is internal and is never called by a browser — see `openapi-ai-service.yaml`.

    ### Conventions
    - Every endpoint except `/api/auth/**` requires `Authorization: Bearer <accessToken>`.
    - Every row is scoped to the authenticated user; a resource belonging to another user is
      reported as `404 NOT_FOUND`, never `403`.
    - Topics are addressed by their **slug**, not their id. Slugs are unique per user and are
      regenerated by the depth pass from a topic's final title.
    - Errors share one envelope (`Error`). The `code` field is the stable contract; `message`
      is human-readable and may change.

    ### Errors
    Anything unhandled becomes `500 INTERNAL`, and its `message` currently embeds the
    underlying exception text (including SQL). Treat `message` as diagnostic, never as
    something to show a user or parse.

    ### Cost rules that leak into this API
    Only `/api/ai/**` reaches a paid model. Those responses carry `budgetWarning: true` once
    the month's spend passes the user's cap — the request still succeeds, served by the cheap
    model tier. Nothing hard-blocks on budget.

    When the user's provider is `desktop`, AI endpoints do not call a model at all. They
    return `200` with `{ "desktop_mode": true, "desktop_prompt": "…" }` for the user to paste
    into their own assistant. Treat that as a valid success shape on any `/api/ai/**` or
    `/api/onboarding/**` call that would otherwise spend money.

servers:
  - url: http://localhost:8080
    description: Local docker-compose
  - url: /
    description: Same-origin (behind the frontend's dev proxy)

tags:
  - name: Auth
    description: Registration, login, token refresh. The only unauthenticated endpoints.
  - name: Me
    description: Current user + LLM/budget settings.
  - name: Onboarding
    description: Résumé → confirmed profile → generated plan → commit.
  - name: Study
    description: The plan itself — phases, weeks, topics, progress.
  - name: Content
    description: Per-topic notes, resources, exercises, questions, attachments.
  - name: Interviews
    description: Logged real interviews and their questions. Drives the feedback loop.
  - name: Review
    description: The today queue and the feedback-loop review flags.
  - name: Plan
    description: Coverage audit and AI-assisted rebalancing.
  - name: Mock
    description: Conversational mock interviewer sessions.
  - name: AI
    description: Metered gateway to ai-service. Cached, budget-guarded, usage-logged.
  - name: Prep Pack
    description: Per-interview preparation pack generated by an agent.
  - name: Jobs
    description: Job alerts ingested from Gmail.
  - name: STAR
    description: Behavioural story bank.
  - name: Usage
    description: Month-to-date model spend against the budget.

security:
  - bearerAuth: []

paths:

  # ────────────────────────────────────────────────────────────── Auth ──
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Create an account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '200':
          description: Account created; tokens issued immediately.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '409':
          description: Email already registered (`CONFLICT`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Exchange credentials for tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401':
          description: Unknown email or wrong password (`BAD_CREDENTIALS`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Mint a new access token from a refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: New token pair.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401':
          description: Expired (`TOKEN_EXPIRED`), malformed, or an access token was sent instead (`TOKEN_INVALID`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ──────────────────────────────────────────────────────────────── Me ──
  /api/me:
    get:
      tags: [Me]
      summary: Current user, settings, and onboarding state
      responses:
        '200':
          description: OK. `onboarded=false` means the client should route to onboarding.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Me]
      summary: Update display name and/or LLM settings
      description: |
        Sparse update — omitted fields are left untouched. `prepWeeks` and `hoursPerWeek`
        are **not** settable here; they are written by the onboarding plan step.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatchMeRequest' }
      responses:
        '200':
          description: Updated state, in the same shape as `GET /api/me`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ──────────────────────────────────────────────────────── Onboarding ──
  /api/onboarding/resume:
    post:
      tags: [Onboarding]
      summary: Upload a résumé and parse it with a model
      description: |
        Accepts PDF or plain text. The file bytes go to the `FileStore`; only a `file_ref`
        is stored in Postgres. The parse is a metered model call.

        The `X-Override-Provider` headers let the client force a provider for this one call
        without mutating `user_settings` — used by the onboarding screen's provider picker.
      parameters:
        - name: X-Override-Provider
          in: header
          required: false
          schema: { type: string, enum: [anthropic, openai, gemini, bedrock, ollama, desktop] }
          description: Force a provider for this call only.
        - name: X-Ollama-Url
          in: header
          required: false
          schema: { type: string, format: uri }
        - name: X-Ollama-Model
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The résumé — `application/pdf` or `text/plain`.
      responses:
        '200':
          description: |
            Parsed profile, or — when the provider is `desktop` — a prompt to paste elsewhere.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ParsedResumeEnvelope'
                  - $ref: '#/components/schemas/DesktopModeResponse'
        '400':
          description: '`FILE_TOO_LARGE` or `UNSUPPORTED_FILE_TYPE`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/AiUnavailable' }

  /api/onboarding/resume/manual:
    post:
      tags: [Onboarding]
      summary: Attach a résumé whose JSON was parsed off-platform
      description: Desktop-mode counterpart of `/resume` — the user pastes back the parsed JSON.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, parsedJson]
              properties:
                file:
                  type: string
                  format: binary
                parsedJson:
                  type: string
                  description: JSON string matching `ResumeProfile`.
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParsedResumeEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/onboarding/profile:
    put:
      tags: [Onboarding]
      summary: Confirm the parsed profile and set targets
      description: |
        Parsing is lossy, so the user corrects it here. The **confirmed** profile — not the
        parsed one — is what plan generation and topic tagging read.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmProfileRequest' }
      responses:
        '200':
          description: Confirmed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [confirmed] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No résumé uploaded yet (`NOT_FOUND`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/onboarding/plan:
    post:
      tags: [Onboarding]
      summary: Generate a study plan from the confirmed profile
      description: |
        A metered model call. Returns the plan **structure only** — phases, themed weeks, and
        coarse topics. Depth content, resources, questions and exercises are produced later by
        the seed pipeline. Nothing is persisted until `PUT /api/onboarding/plan/commit`.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GeneratePlanRequest' }
      responses:
        '200':
          description: The draft plan, or a desktop-mode prompt.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      phases:
                        type: array
                        items: { $ref: '#/components/schemas/DraftPhase' }
                  - $ref: '#/components/schemas/DesktopModeResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Profile not confirmed yet (`NOT_FOUND`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502': { $ref: '#/components/responses/AiUnavailable' }

  /api/onboarding/plan/manual:
    post:
      tags: [Onboarding]
      summary: Echo back a plan generated off-platform
      description: |
        Validates that a `phases` array is present and returns it. Desktop-mode bridge — the
        client then commits it exactly as it would an AI-generated plan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phases]
              properties:
                phases:
                  type: array
                  items: { $ref: '#/components/schemas/DraftPhase' }
      responses:
        '200':
          description: Accepted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  phases:
                    type: array
                    items: { $ref: '#/components/schemas/DraftPhase' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/onboarding/plan/commit:
    put:
      tags: [Onboarding]
      summary: Persist a plan, replacing any existing one
      description: |
        **Destructive.** Deletes the user's current `phase` rows; the database cascade removes
        their weeks and topics, and with them every note, resource, exercise, question and
        review flag hanging off those topics. Commit only from the review screen.

        Per topic this writes:
        - `source` — taken from the plan's own `source` field (`resume|standard|interest|custom`);
          anything unrecognised degrades to `standard`. Never inferred.
        - `tag` — computed in code from the topic's scope terms against the confirmed résumé
          skills (`dsa|exp|refresh|new`). Never taken from the request.
        - `angle` — the `scope` line, which becomes the depth pass's coverage contract.

        Accepts both `coarse_topics` (raw v2 plan JSON) and `topics` (the frontend's normalised
        key). Week `bridge`, `anchor` and `unlocks` are persisted when present, so a hand-authored
        plan keeps its narrative instead of waiting for the narrative pass.

        Also marks the profile `planCommitted` and the user `onboarded`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phases]
              properties:
                phases:
                  type: array
                  items: { $ref: '#/components/schemas/DraftPhase' }
      responses:
        '200':
          description: Committed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [committed] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No confirmed profile (`NOT_FOUND`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ───────────────────────────────────────────────────────────── Study ──
  /api/phases:
    get:
      tags: [Study]
      summary: The whole plan — phases, weeks, topic summaries
      description: The Study screen's single read. Ordered by phase, week, then topic display order.
      responses:
        '200':
          description: OK. An empty array means the plan was never committed.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PhaseSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/progress:
    get:
      tags: [Study]
      summary: Overall readiness, streak, and per-track scores
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OverallProgress' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/topics:
    post:
      tags: [Study]
      summary: Add a custom topic to a week
      description: Sets `source="custom"` and `isCustom=true`. `tag` is taken from the request here.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTopicRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopicDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Unknown `weekCode` (`NOT_FOUND`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/topics/{slug}:
    parameters:
      - $ref: '#/components/parameters/TopicSlug'
    get:
      tags: [Study]
      summary: One topic with all of its content
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopicDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Study]
      summary: Update a topic
      description: |
        Sparse update. Setting `status="done"` stamps `lastReviewedAt` and defaults
        `confidence` to 80 when it was never set.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTopicRequest' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopicDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Study]
      summary: Delete a topic and its content
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────────────────────────────────────────── Content ──
  /api/topics/{slug}/note:
    parameters:
      - $ref: '#/components/parameters/TopicSlug'
    get:
      tags: [Content]
      summary: The topic's markdown note
      responses:
        '200':
          description: OK. A topic with no note yet returns an empty `contentMd`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Note' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Content]
      summary: Create or replace the note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contentMd: { type: string }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Note' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/topics/{slug}/note/attachments:
    post:
      tags: [Content]
      summary: Attach an image to the note
      description: Bytes go to the `FileStore`; Postgres stores only a `file_ref`.
      parameters:
        - $ref: '#/components/parameters/TopicSlug'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Attached.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        '400':
          description: '`FILE_TOO_LARGE` or `UNSUPPORTED_FILE_TYPE`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/attachments/{id}:
    parameters:
      - $ref: '#/components/parameters/NumericId'
    get:
      tags: [Content]
      summary: Stream an attachment's bytes
      responses:
        '200':
          description: The raw file.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Content]
      summary: Delete an attachment
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/topics/{slug}/resources:
    parameters:
      - $ref: '#/components/parameters/TopicSlug'
    get:
      tags: [Content]
      summary: List a topic's resources
      responses:
        '200':
          description: OK, in display order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Resource' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Content]
      summary: Add a resource
      description: Created with `source="manual"`, which protects it from AI regeneration.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Resource' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Resource' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/resources/{id}:
    parameters:
      - $ref: '#/components/parameters/NumericId'
    patch:
      tags: [Content]
      summary: Update a resource
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Resource' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Resource' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Content]
      summary: Delete a resource
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/topics/{slug}/exercises:
    parameters:
      - $ref: '#/components/parameters/TopicSlug'
    get:
      tags: [Content]
      summary: List a topic's exercises
      responses:
        '200':
          description: OK, in display order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Exercise' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Content]
      summary: Add an exercise
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Exercise' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Exercise' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/exercises/{id}:
    parameters:
      - $ref: '#/components/parameters/NumericId'
    patch:
      tags: [Content]
      summary: Update an exercise
      description: Ticking `done` here is how exercise progress is recorded.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Exercise' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Exercise' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Content]
      summary: Delete an exercise
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/topics/{slug}/questions:
    parameters:
      - $ref: '#/components/parameters/TopicSlug'
    get:
      tags: [Content]
      summary: List a topic's practice questions
      responses:
        '200':
          description: OK, in display order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Question' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Content]
      summary: Add a question
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Question' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Question' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/questions/{id}:
    delete:
      tags: [Content]
      summary: Delete a question
      parameters:
        - $ref: '#/components/parameters/NumericId'
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ──────────────────────────────────────────────────────── Interviews ──
  /api/interviews:
    get:
      tags: [Interviews]
      summary: List logged interviews
      responses:
        '200':
          description: OK, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InterviewSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Interviews]
      summary: Log an interview
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInterviewRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InterviewSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/interviews/{id}:
    parameters:
      - $ref: '#/components/parameters/NumericId'
    get:
      tags: [Interviews]
      summary: One interview with its questions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InterviewDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Interviews]
      summary: Update stage, outcome, notes
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateInterviewRequest' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InterviewSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/interviews/{id}/questions:
    post:
      tags: [Interviews]
      summary: Log a question that was asked — this drives the feedback loop
      description: |
        **The feedback loop lives here, in code, not in an agent.** A `selfRating` of 1 or 2
        creates a `review_flag` against the linked topic and lowers that topic's `confidence`.
        The topic then surfaces in `GET /api/review/today` and its AI guide regenerates with
        the gap called out.

        `topicSlug` is optional; without it the rating is recorded but no topic is flagged.
      parameters:
        - $ref: '#/components/parameters/NumericId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogQuestionRequest' }
      responses:
        '201':
          description: The interview, including the new question and recomputed `weak` list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InterviewDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/interviews/questions/{questionId}:
    parameters:
      - name: questionId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    patch:
      tags: [Interviews]
      summary: Re-rate or re-link a logged question
      description: Re-running the feedback-loop rule may raise or resolve a review flag.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogQuestionRequest' }
      responses:
        '200':
          description: The updated interview.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InterviewDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Interviews]
      summary: Remove a logged question
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ──────────────────────────────────────────────────────────── Review ──
  /api/review/today:
    get:
      tags: [Review]
      summary: Today's study queue
      description: |
        Recomputed on every fetch, never stored. Fills the day's minute budget in priority
        order: `flagged` (weak interview answers) → `new` (next unstudied topics) →
        `spaced` (due for repetition).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TodayQueue' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/review/{slug}/done:
    post:
      tags: [Review]
      summary: Mark a topic reviewed
      description: |
        Resolves the topic's open review flags, sets `status="done"`, stamps `lastReviewedAt`,
        and raises `confidence` by 20 (capped at 100).
      parameters:
        - $ref: '#/components/parameters/TopicSlug'
      responses:
        '200': { description: Recorded. Empty body. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ────────────────────────────────────────────────────────────── Plan ──
  /api/plan/audit:
    post:
      tags: [Plan]
      summary: Checklist coverage and week-budget feasibility
      description: |
        **Deterministic and free — no model call.** For every résumé skill claimed at
        expert/advanced level that has a checklist in `library/checklists/`, reports what
        fraction of that checklist the plan covers and which items are missing. Each gap is
        placed in the earliest, least-loaded week that already teaches its category.

        Gaps are suggestions. Nothing is inserted; the plan-review screen offers one-click Add.

        Send `{"phases": […]}` to audit a **draft** plan before commit. Send `{}` (or an empty
        body) to audit the **committed** plan.

        Week load uses each topic's `estMinutes`. Before the depth pass has run those are
        absent, so a nominal 45 minutes per coarse topic is assumed and `estimated: true`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                phases:
                  type: array
                  description: A draft plan. Omit to audit the committed plan.
                  items: { $ref: '#/components/schemas/DraftPhase' }
      responses:
        '200':
          description: OK. `coverage` is empty when no claimed-expert skill has a checklist.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanAudit' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/plan/rebalance:
    post:
      tags: [Plan]
      summary: Ask the coach agent to rebalance the plan
      description: A metered model call. Sends progress and open-flag counts to the coach agent.
      responses:
        '200':
          description: The agent's suggestions, passed through from ai-service.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/AiUnavailable' }

  # ────────────────────────────────────────────────────────────── Mock ──
  /api/mocks/start:
    post:
      tags: [Mock]
      summary: Start a mock interview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  default: technical
                  description: e.g. `technical`, `behavioral`, `system_design`.
                topicSlug:
                  type: string
                  nullable: true
                  description: Anchors the interviewer to one topic; also lets a low score feed the loop.
      responses:
        '201':
          description: Session created; the transcript holds the interviewer's opening question.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MockStartResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/AiUnavailable' }

  /api/mocks/{id}/turn:
    post:
      tags: [Mock]
      summary: Answer the current question
      description: |
        When the interviewer decides the session is over it returns `done: true` with a score.
        A score of ≤ 2 on a topic-anchored session raises a review flag, exactly as a real
        interview would.
      parameters:
        - $ref: '#/components/parameters/NumericId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties:
                answer: { type: string, minLength: 1 }
      responses:
        '200':
          description: The interviewer's reply.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MockTurnResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Empty answer, or the session is already completed (`VALIDATION`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/mocks/{id}:
    get:
      tags: [Mock]
      summary: Replay a session
      parameters:
        - $ref: '#/components/parameters/NumericId'
      responses:
        '200':
          description: OK. `feedback` is `{}` until the session completes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MockSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ──────────────────────────────────────────────────────────────── AI ──
  /api/ai/guide:
    post:
      tags: [AI]
      summary: Generate one tab of a topic's study guide
      description: |
        Metered. Checks `ai_cache` first — a cache hit costs nothing. Generated rows replace
        the previous **AI** rows for that tab and leave `manual` rows untouched, so
        regenerating never duplicates or destroys the user's own entries.

        Unresolved review flags on the topic are part of the cache key, so a newly flagged
        topic regenerates its guide with the gap called out.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug]
              properties:
                slug: { type: string }
                tab:
                  type: string
                  enum: [overview, resources, exercises, questions]
                  default: overview
      responses:
        '200':
          description: Content persisted against the topic.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
                  budgetWarning: { $ref: '#/components/schemas/BudgetWarning' }
        '400':
          description: '`slug` missing (`VALIDATION`).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/AiUnavailable' }

  /api/ai/seed-plan:
    post:
      tags: [AI]
      summary: Start the content pipeline over the committed plan
      description: |
        Returns immediately; the pipeline runs in the background (narrative → per week: depth →
        support) so the user can start studying week 1 while later weeks fill in. Poll
        `/api/ai/seed-plan/status`.

        The depth pass enforces the **covered-split contract**: every mechanism named in a
        coarse topic's title or scope must survive into some child topic, otherwise the pass
        narrowed the unit and is retried for the dropped terms. Unrecoverable scope loss marks
        the topic `needsReview` rather than silently shipping a thinner curriculum.

        With `provider=desktop` this instead returns synchronously with a paste-able prompt.
      parameters:
        - name: provider
          in: query
          required: false
          schema: { type: string, enum: [desktop] }
          description: Overrides the user's configured provider for this call.
      responses:
        '200':
          description: Pipeline started, or a desktop prompt.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      status: { type: string, enum: [started] }
                  - $ref: '#/components/schemas/SeedStatus'
                  - $ref: '#/components/schemas/DesktopModeResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/ai/seed-plan/status:
    get:
      tags: [AI]
      summary: Poll the content pipeline
      description: In-memory and per-process — a restart resets it to `idle`. The pipeline itself is resumable.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeedStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/ai/seed-plan/manual:
    post:
      tags: [AI]
      summary: Persist seed content generated off-platform
      description: Desktop-mode counterpart of `/seed-plan`. Same persistence path as the AI result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [topics]
              properties:
                topics:
                  type: array
                  items: { $ref: '#/components/schemas/SeededTopic' }
      responses:
        '200':
          description: Counts of what was persisted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  seeded: { type: integer }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: No top-level `topics` array (`VALIDATION`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/ai/mock:
    post:
      tags: [AI]
      summary: Raw pass-through to the mock interviewer
      description: |
        Thin proxy to `POST /ai/mock` on ai-service. Prefer `/api/mocks/**`, which persists the
        session and wires the feedback loop; this endpoint does neither.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Pass-through envelope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/AiUnavailable' }

  /api/ai/analyze:
    post:
      tags: [AI]
      summary: Grade a free-text answer against a question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question, answer]
              properties:
                question: { type: string }
                answer: { type: string }
      responses:
        '200':
          description: |
            The analysis, in the standard envelope. `result` carries `rating` (1–5), `strengths`,
            `weaknesses`, `idealPoints`, `flagForReview` and `summary`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/AiUnavailable' }

  # ───────────────────────────────────────────────────────── Prep Pack ──
  /api/interviews/{id}/prep-pack:
    parameters:
      - $ref: '#/components/parameters/NumericId'
    post:
      tags: [Prep Pack]
      summary: Generate a prep pack for an interview
      description: |
        Runs the prep-pack agent against the interview's job description. Idempotent — if a
        pack already exists it is returned unchanged rather than regenerated (and re-billed).
      responses:
        '200':
          description: The pack.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrepPack' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/AiUnavailable' }
    get:
      tags: [Prep Pack]
      summary: Fetch the prep pack, generating it if absent
      description: |
        Identical to `POST` — both call `getOrCreate`. A `GET` against an interview with no
        pack **will run the agent and bill a model call**. It is not a safe read.
      responses:
        '200':
          description: The pack.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrepPack' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/AiUnavailable' }

  # ────────────────────────────────────────────────────────────── Jobs ──
  /api/jobs:
    get:
      tags: [Jobs]
      summary: List ingested job alerts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/JobAlert' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/jobs/sync:
    post:
      tags: [Jobs]
      summary: Pull job emails from Gmail now
      description: |
        Fetches, classifies, and ingests. Ingestion is idempotent on the Gmail message id, so
        re-syncing does not duplicate alerts — hence `matched` can exceed `ingested`.
      responses:
        '200':
          description: Sync counts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  fetched:  { type: integer, description: Emails pulled from Gmail. }
                  matched:  { type: integer, description: Classified as job alerts. }
                  ingested: { type: integer, description: Newly stored (not already seen). }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Gmail is not configured (`CONFLICT`) — set `app.gmail.enabled` and the Vault credentials.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/jobs/{id}:
    patch:
      tags: [Jobs]
      summary: Update an alert's status or match score
      parameters:
        - $ref: '#/components/parameters/NumericId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  description: 'e.g. `new`, `applied`, `rejected`, `ignored`.'
                matchScore: { type: number, format: double, minimum: 0, maximum: 1 }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobAlert' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ────────────────────────────────────────────────────────────── STAR ──
  /api/star-stories:
    get:
      tags: [STAR]
      summary: List STAR stories
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StarStory' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [STAR]
      summary: Create a STAR story
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StarStory' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StarStory' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/star-stories/{id}:
    parameters:
      - $ref: '#/components/parameters/NumericId'
    get:
      tags: [STAR]
      summary: One STAR story
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StarStory' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [STAR]
      summary: Replace a STAR story
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StarStory' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StarStory' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [STAR]
      summary: Delete a STAR story
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────────────────────────────────────── Usage ──
  /api/usage:
    get:
      tags: [Usage]
      summary: Month-to-date model spend
      description: Summed from `usage_log`, which gets a row for every model call.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsageSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token from `/api/auth/login`. HS256, `sub` = user id, `type` = `access`.
        Refresh tokens carry `type: refresh` and are rejected on protected routes.

  parameters:
    TopicSlug:
      name: slug
      in: path
      required: true
      schema: { type: string }
      description: The topic's slug, unique per user.
      example: threadpoolexecutor-internals-sizing-queueing-rejection
    NumericId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }

  responses:
    Unauthorized:
      description: Missing, malformed or expired token.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: |
        No such resource **for this user**. Resources owned by another user are reported as
        `404`, never `403`, so the API does not leak their existence.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Bean-validation failure. `message` lists the offending fields.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    AiUnavailable:
      description: ai-service is down or errored (`AI_SERVICE_UNAVAILABLE`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:

    # ── cross-cutting ──────────────────────────────────────────────────
    Error:
      type: object
      required: [code, message, timestamp]
      properties:
        code:
          type: string
          description: The stable contract. `message` is for humans and may change.
          enum:
            - BAD_CREDENTIALS
            - TOKEN_EXPIRED
            - TOKEN_INVALID
            - NOT_FOUND
            - CONFLICT
            - VALIDATION
            - AI_SERVICE_UNAVAILABLE
            - PLAN_NOT_COMMITTED
            - FILE_TOO_LARGE
            - UNSUPPORTED_FILE_TYPE
            - INTERNAL
        message: { type: string }
        timestamp: { type: string, format: date-time }
      example:
        code: NOT_FOUND
        message: 'Topic not found: kafka-internals'
        timestamp: '2026-07-10T12:00:00Z'

    BudgetWarning:
      type: boolean
      default: false
      description: |
        `true` once month-to-date spend exceeds the user's cap. The call still succeeded — it
        was served by the cheap model tier. Budget never hard-blocks.

    AiEnvelope:
      type: object
      description: The shape ai-service returns, passed through unchanged.
      properties:
        result:
          type: object
          additionalProperties: true
          description: Endpoint-specific payload.
        meta: { $ref: '#/components/schemas/AiMeta' }
        budgetWarning: { $ref: '#/components/schemas/BudgetWarning' }

    AiMeta:
      type: object
      properties:
        model:  { type: string, example: claude-fable-5 }
        cached: { type: boolean, description: Served from `ai_cache`; cost was zero. }
        tokens: { type: integer }
        cost:   { type: number, format: double, description: USD for this call. }

    DesktopModeResponse:
      type: object
      description: |
        Returned with `200` when the user's provider is `desktop`. No model was called and
        nothing was billed; the user pastes `desktop_prompt` into their own assistant and
        returns the output via the matching `/manual` endpoint.
      properties:
        desktop_mode:   { type: boolean, enum: [true] }
        desktop_prompt: { type: string }

    # ── auth & me ──────────────────────────────────────────────────────
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:       { type: string, format: email }
        password:    { type: string, minLength: 8, format: password }
        displayName: { type: string, nullable: true }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:    { type: string, format: email }
        password: { type: string, format: password }

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    TokenResponse:
      type: object
      properties:
        accessToken:  { type: string }
        refreshToken: { type: string }
        expiresIn:    { type: integer, format: int64, description: 'Access-token lifetime, seconds.' }

    MeResponse:
      type: object
      properties:
        user:
          type: object
          properties:
            email:       { type: string, format: email }
            displayName: { type: string, nullable: true }
        settings: { $ref: '#/components/schemas/Settings' }
        onboarded:
          type: boolean
          description: '`false` until the plan is committed. Clients should route to onboarding.'

    Settings:
      type: object
      properties:
        llmProvider:      { type: string, enum: [anthropic, openai, gemini, bedrock, ollama, desktop] }
        modelStrong:      { type: string, nullable: true, description: Used for depth — the pass that needs reasoning. }
        modelCheap:       { type: string, nullable: true, description: Used for narrative and support passes. }
        ollamaUrl:        { type: string, nullable: true, format: uri }
        monthlyBudgetUsd: { type: number, format: double }

    PatchMeRequest:
      type: object
      properties:
        displayName: { type: string }
        settings:
          type: object
          properties:
            llmProvider:      { type: string }
            modelStrong:      { type: string }
            modelCheap:       { type: string }
            ollamaUrl:        { type: string, format: uri }
            monthlyBudgetUsd: { type: number, format: double }

    # ── onboarding ─────────────────────────────────────────────────────
    ResumeProfile:
      type: object
      description: The parsed — then user-corrected — résumé. Drives plan generation and tagging.
      properties:
        seniority:  { type: string, example: senior }
        totalYears: { type: integer, example: 11 }
        domains:
          type: array
          items: { type: string }
        skills:
          type: array
          items: { $ref: '#/components/schemas/Skill' }
        gaps:
          type: array
          description: Areas absent from the résumé. Only role-relevant ones earn plan weeks.
          items: { type: string }
        experiences:
          type: array
          items:
            type: object
            properties:
              company: { type: string }
              role:    { type: string }
              dates:   { type: string }
              highlights:
                type: array
                items: { type: string }
              technologies:
                type: array
                items: { type: string }

    Skill:
      type: object
      properties:
        name:  { type: string, example: Java }
        level:
          type: string
          enum: [beginner, intermediate, advanced, expert]
          description: '`expert`/`advanced` attract the deepest questions — and trigger checklist audits.'
        years: { type: integer, nullable: true }

    ParsedResumeEnvelope:
      type: object
      properties:
        result: { $ref: '#/components/schemas/ResumeProfile' }
        meta:   { $ref: '#/components/schemas/AiMeta' }

    ConfirmProfileRequest:
      type: object
      properties:
        profile:     { $ref: '#/components/schemas/ResumeProfile' }
        targetRole:  { type: string, example: Technical Lead }
        targetLevel: { type: string, example: Principal Engineer }
        prepWeeks:   { type: integer, example: 26 }

    GeneratePlanRequest:
      type: object
      properties:
        targetRole:       { type: string }
        targetLevel:      { type: string }
        prepWeeks:        { type: integer, example: 26 }
        hoursPerWeek:     { type: integer, example: 12 }
        monthlyBudgetUsd: { type: number, format: double }
        interests:
          type: array
          description: Supplementary add-ons. Capped at ~15% of weeks, dropped when time is short.
          items: { type: string }
        additionalContext: { type: string, description: Free-text override for the plan prompt. }
        regenerate:
          type: boolean
          default: false
          description: Bypass `ai_cache` and pay for a fresh plan.

    DraftPhase:
      type: object
      description: A phase of an uncommitted plan.
      properties:
        name:  { type: string, example: Technical Skills Depth Review — Java Core }
        goal:  { type: string, description: Persisted as the phase `blurb`. }
        weeks:
          type: integer
          description: Week count. Ignored on commit — `weeks_detail` is authoritative.
        weeks_detail:
          type: array
          items: { $ref: '#/components/schemas/DraftWeek' }

    DraftWeek:
      type: object
      properties:
        week_number: { type: integer }
        title:
          type: string
          description: 'Stored as `Week {n} — {title}`.'
        bridge:      { type: string, nullable: true, description: Why this week comes now. }
        anchor:      { type: string, nullable: true, description: How it ties to the candidate's own work. }
        unlocks:     { type: string, nullable: true, description: What later weeks it enables. }
        coarse_topics:
          type: array
          description: |
            The raw v2 key. The frontend renames it to `topics` during normalisation; commit
            accepts either.
          items: { $ref: '#/components/schemas/CoarseTopic' }

    CoarseTopic:
      type: object
      description: |
        A study unit the depth pass may expand into 1–3 concrete subtopics — scoped like a
        chapter section, not a leaf bullet.
      required: [title]
      properties:
        title:    { type: string, maxLength: 90 }
        category: { $ref: '#/components/schemas/TopicCategory' }
        source:   { $ref: '#/components/schemas/TopicSource' }
        priority: { type: string, enum: [high, medium, low] }
        scope:
          type: string
          description: |
            The contract with the depth pass: what to cover and how deep. **Every technology
            named here is mechanically checked for in the generated content** — do not name
            what you do not want taught.
        split_hint:
          type: string
          enum: [none, maybe, likely]
          description: |
            `likely` for broad units holding several interview-distinct subtopics; `none` for
            atomic ones. A `likely` unit that yields a single child is treated as a failure.

    # ── study ──────────────────────────────────────────────────────────
    TopicCategory:
      type: string
      enum: [dsa, system_design, behavioral, language, framework, cloud, domain]
      description: Assigned by the plan pass. Selects the depth exemplar and the audit checklist.

    TopicSource:
      type: string
      enum: [resume, standard, interest, custom]
      description: |
        *Why* the topic is in the plan. Set by the plan pass (it knows why it added the unit);
        split children inherit it; topics added by the user are `custom`. Never inferred.

    TopicTag:
      type: string
      enum: [new, refresh, exp, dsa]
      description: |
        What the topic is *to this candidate*, computed in code from its scope terms against
        the confirmed résumé — never taken from the LLM or the request (except on
        `POST /api/topics`). `exp`: claimed at expert/advanced, expect the hardest questions.
        `refresh`: claimed at a lower level. `new`: absent from the résumé. `dsa`: category wins.

    TopicStatus:
      type: string
      enum: [todo, done]

    PhaseSummary:
      type: object
      properties:
        code:     { type: string, example: phase-1 }
        name:     { type: string }
        icon:     { type: string, nullable: true }
        blurb:    { type: string, nullable: true }
        progress: { $ref: '#/components/schemas/Progress' }
        weeks:
          type: array
          items: { $ref: '#/components/schemas/WeekSummary' }

    WeekSummary:
      type: object
      properties:
        code:   { type: string, example: w-1-1 }
        title:  { type: string, example: 'Week 1 — JVM internals, memory, GC & profiling' }
        bridge: { type: string, nullable: true }
        anchor: { type: string, nullable: true }
        topics:
          type: array
          items: { $ref: '#/components/schemas/TopicSummary' }

    Progress:
      type: object
      properties:
        done:  { type: integer }
        total: { type: integer }

    TopicSummary:
      type: object
      properties:
        slug:       { type: string }
        code:       { type: string }
        title:      { type: string }
        tag:        { $ref: '#/components/schemas/TopicTag' }
        source:     { $ref: '#/components/schemas/TopicSource' }
        status:     { $ref: '#/components/schemas/TopicStatus' }
        confidence: { type: integer, nullable: true, minimum: 0, maximum: 100 }

    TopicDetail:
      type: object
      properties:
        id:             { type: integer, format: int64 }
        slug:           { type: string }
        code:           { type: string }
        title:          { type: string }
        tag:            { $ref: '#/components/schemas/TopicTag' }
        source:         { $ref: '#/components/schemas/TopicSource' }
        status:         { $ref: '#/components/schemas/TopicStatus' }
        isCustom:       { type: boolean }
        confidence:     { type: integer, nullable: true, minimum: 0, maximum: 100 }
        lastReviewedAt: { type: string, format: date-time, nullable: true }
        deepDive:       { $ref: '#/components/schemas/DeepDive' }
        note:           { $ref: '#/components/schemas/Note' }
        resources:
          type: array
          items: { $ref: '#/components/schemas/Resource' }
        exercises:
          type: array
          items: { $ref: '#/components/schemas/Exercise' }
        questions:
          type: array
          items: { $ref: '#/components/schemas/Question' }

    DeepDive:
      type: object
      description: |
        The depth pass's card. Empty until the seed pipeline reaches this topic's week.
      properties:
        concept:
          type: string
          nullable: true
          description: 2–4 sentences stating the mechanism and the trade-off at its heart.
        points:
          type: array
          description: |
            4–6 bullets, each mechanically validated to carry a concrete token — a flag
            (`-XX:…`), a number, an identifier (`ThreadPoolExecutor`), or a named pattern.
          items: { type: string }
        angle:
          type: string
          nullable: true
          description: The master interview question, plus what a strong answer includes.

    CreateTopicRequest:
      type: object
      required: [weekCode, title, tag]
      properties:
        weekCode: { type: string, example: w-1-1 }
        title:    { type: string }
        tag:      { $ref: '#/components/schemas/TopicTag' }
        concept:  { type: string }
        points:
          type: array
          items: { type: string }
        angle:    { type: string }

    UpdateTopicRequest:
      type: object
      description: Sparse — omitted fields are untouched.
      properties:
        title:      { type: string }
        tag:        { $ref: '#/components/schemas/TopicTag' }
        status:     { $ref: '#/components/schemas/TopicStatus' }
        concept:    { type: string }
        points:
          type: array
          items: { type: string }
        angle:      { type: string }
        confidence: { type: integer, minimum: 0, maximum: 100 }

    OverallProgress:
      type: object
      properties:
        overallPct: { type: integer, minimum: 0, maximum: 100 }
        streak:     { type: integer, description: Consecutive days with a completed topic. }
        tracks:
          type: array
          items:
            type: object
            properties:
              name:      { type: string }
              readiness: { type: integer, minimum: 0, maximum: 100 }
        flaggedCount:
          type: integer
          format: int64
          description: Unresolved review flags — the feedback loop's backlog.

    # ── content ────────────────────────────────────────────────────────
    Note:
      type: object
      properties:
        contentMd: { type: string, description: Markdown. Empty string when no note exists. }
        updatedAt: { type: string, format: date-time }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/Attachment' }

    Attachment:
      type: object
      properties:
        id:           { type: integer, format: int64 }
        url:          { type: string, description: 'Points at `/api/attachments/{id}`.' }
        originalName: { type: string }
        mimeType:     { type: string }

    Resource:
      type: object
      required: [label, url]
      properties:
        id:           { type: integer, format: int64, readOnly: true, nullable: true }
        label:        { type: string, minLength: 1 }
        url:          { type: string, format: uri, minLength: 1 }
        displayOrder: { type: integer, default: 0 }

    Exercise:
      type: object
      required: [title]
      properties:
        id:           { type: integer, format: int64, readOnly: true, nullable: true }
        title:        { type: string, minLength: 1 }
        repoUrl:      { type: string, format: uri, nullable: true }
        done:         { type: boolean, default: false }
        displayOrder: { type: integer, default: 0 }
        estMinutes:   { type: integer, nullable: true }

    Question:
      type: object
      required: [text]
      properties:
        id:           { type: integer, format: int64, readOnly: true, nullable: true }
        text:         { type: string, minLength: 1 }
        displayOrder: { type: integer, default: 0 }
        type:
          type: string
          nullable: true
          enum: [conceptual, tradeoff, implementation, debugging, scenario]
          description: Lets the mock interviewer sample a balanced set.

    # ── interviews ─────────────────────────────────────────────────────
    CreateInterviewRequest:
      type: object
      required: [company, role, stage]
      properties:
        company:     { type: string, minLength: 1 }
        role:        { type: string, minLength: 1 }
        stage:       { type: string, minLength: 1, example: onsite }
        round:       { type: string, nullable: true }
        scheduledAt: { type: string, format: date, nullable: true }
        jdText:      { type: string, nullable: true, description: Job description. Feeds the prep-pack agent. }

    UpdateInterviewRequest:
      type: object
      description: Sparse — omitted fields are untouched.
      properties:
        stage:       { type: string }
        outcome:     { type: string, example: passed }
        round:       { type: string }
        scheduledAt: { type: string, format: date }
        jdText:      { type: string }
        notes:       { type: string }

    InterviewSummary:
      type: object
      properties:
        id:          { type: integer, format: int64 }
        company:     { type: string }
        role:        { type: string }
        stage:       { type: string }
        round:       { type: string, nullable: true }
        scheduledAt: { type: string, format: date, nullable: true }
        outcome:     { type: string, nullable: true }
        weak:
          type: array
          description: Titles of topics whose answers were rated ≤ 2 in this interview.
          items: { type: string }

    InterviewDetail:
      allOf:
        - $ref: '#/components/schemas/InterviewSummary'
        - type: object
          properties:
            jdText: { type: string, nullable: true }
            notes:  { type: string, nullable: true }
            questions:
              type: array
              items: { $ref: '#/components/schemas/InterviewQuestion' }

    InterviewQuestion:
      type: object
      properties:
        id:         { type: integer, format: int64 }
        text:       { type: string }
        topicSlug:  { type: string, nullable: true }
        selfRating: { type: integer, minimum: 1, maximum: 5 }

    LogQuestionRequest:
      type: object
      required: [text, selfRating]
      properties:
        text: { type: string, minLength: 1 }
        topicSlug:
          type: string
          nullable: true
          description: Link to a plan topic. Without it, no review flag can be raised.
        selfRating:
          type: integer
          minimum: 1
          maximum: 5
          description: '**≤ 2 triggers the feedback loop**: raises a review flag and lowers topic confidence.'

    # ── review ─────────────────────────────────────────────────────────
    TodayQueue:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ReviewItem' }
        budgetMin:  { type: integer, description: 'The day''s minute budget, from `hoursPerWeek`.' }
        plannedMin: { type: integer, description: Minutes the queue actually fills. }
        velocity:   { type: string, description: 'Pace against the plan, e.g. `on track`, `behind`.' }

    ReviewItem:
      type: object
      properties:
        kind:
          type: string
          enum: [flagged, new, spaced]
          description: |
            `flagged` — a weak interview or mock answer. `new` — the next unstudied topic.
            `spaced` — due for repetition. Filled in exactly that priority order.
        topicSlug:  { type: string }
        label:      { type: string }
        note:       { type: string, nullable: true, description: 'For `flagged`, the reason recorded on the flag.' }
        estMinutes: { type: integer, nullable: true }

    # ── plan audit ─────────────────────────────────────────────────────
    PlanAudit:
      type: object
      properties:
        coverage:
          type: array
          items: { $ref: '#/components/schemas/SkillCoverage' }
        suggestions:
          type: array
          description: One per uncovered checklist item, pre-placed into a week. Never auto-inserted.
          items: { $ref: '#/components/schemas/CoverageSuggestion' }
        weeks:
          type: array
          items: { $ref: '#/components/schemas/WeekLoad' }
        budgetMinutes: { type: integer, description: '`hoursPerWeek × 60`.' }
        prepWeeks:     { type: integer, description: Weeks in the audited plan. }

    SkillCoverage:
      type: object
      properties:
        skill:        { type: string, example: java }
        category:     { $ref: '#/components/schemas/TopicCategory' }
        coveragePct:  { type: integer, minimum: 0, maximum: 100 }
        ready:        { type: boolean, description: '`coveragePct >= 70`.' }
        coveredIds:
          type: array
          items: { type: string }
        gaps:
          type: array
          items:
            type: object
            properties:
              id:    { type: string, example: virtual-threads }
              label: { type: string, example: Virtual threads (Java 21 / Loom) }

    CoverageSuggestion:
      type: object
      properties:
        id:         { type: string }
        label:      { type: string }
        skill:      { type: string }
        category:   { $ref: '#/components/schemas/TopicCategory' }
        phaseIndex: { type: integer, description: Index into the audited plan's phases. }
        weekIndex:  { type: integer, description: Index into that phase's weeks. }
        weekTitle:  { type: string }

    WeekLoad:
      type: object
      properties:
        phaseIndex:     { type: integer }
        weekIndex:      { type: integer }
        weekTitle:      { type: string }
        plannedMinutes: { type: integer }
        budgetMinutes:  { type: integer }
        over:           { type: boolean, description: '`plannedMinutes > budgetMinutes`.' }
        estimated:
          type: boolean
          description: |
            `true` when the depth pass has not run, so 45 minutes per coarse topic was assumed
            rather than summed from real `estMinutes`.

    # ── AI pipeline ────────────────────────────────────────────────────
    SeedStatus:
      type: object
      description: |
        In-memory, per-process. A restart resets it to `idle`, and an idle response carries
        **only** `{"state": "idle"}` — the counters appear once a run starts.
      properties:
        state:          { type: string, enum: [idle, running, done, failed] }
        stage:          { type: string, enum: [starting, narrative, depth, support, done] }
        weeksDone:      { type: integer }
        weeksTotal:     { type: integer }
        topicsDeepened: { type: integer }
        needsReview:
          type: integer
          description: |
            Topics whose depth output failed validation twice, or whose scope could not be
            recovered after a repair pass. Surfaced in the UI with a regenerate button.
        startedAt: { type: string, format: date-time }
        message:   { type: string, description: Present only when `state=failed`. }

    SeededTopic:
      type: object
      description: One topic's worth of generated content, as produced off-platform in desktop mode.
      required: [slug]
      properties:
        slug:    { type: string }
        concept: { type: string }
        points:
          type: array
          items: { type: string }
        angle:   { type: string }
        resources:
          type: array
          items: { $ref: '#/components/schemas/Resource' }
        exercises:
          type: array
          items: { $ref: '#/components/schemas/Exercise' }
        questions:
          type: array
          items: { $ref: '#/components/schemas/Question' }

    # ── mock ───────────────────────────────────────────────────────────
    MockTurn:
      type: object
      properties:
        role: { type: string, enum: [ai, user] }
        text: { type: string }

    MockStartResponse:
      type: object
      properties:
        id:            { type: integer, format: int64 }
        transcript:
          type: array
          items: { $ref: '#/components/schemas/MockTurn' }
        budgetWarning: { $ref: '#/components/schemas/BudgetWarning' }

    MockTurnResponse:
      type: object
      properties:
        result:
          type: object
          properties:
            reply:    { type: string }
            done:     { type: boolean, description: The interviewer ended the session. }
            score:    { type: integer, minimum: 1, maximum: 5, nullable: true, description: Present when `done`. }
            feedback: { type: string, nullable: true }
        budgetWarning: { $ref: '#/components/schemas/BudgetWarning' }

    MockSession:
      type: object
      properties:
        id:        { type: integer, format: int64 }
        type:      { type: string }
        topicSlug: { type: string, nullable: true }
        status:    { type: string, enum: [in_progress, completed] }
        turns:
          type: array
          items: { $ref: '#/components/schemas/MockTurn' }
        feedback:
          type: object
          description: '`{}` until the session completes.'
          properties:
            score:    { type: integer }
            feedback: { type: string }

    # ── prep pack, jobs, star, usage ───────────────────────────────────
    PrepPack:
      type: object
      properties:
        id: { type: integer, format: int64 }
        topics:
          type: array
          description: Topics to revise before this interview.
          items: { type: object, additionalProperties: true }
        questions:
          type: array
          items: { type: object, additionalProperties: true }
        tips:
          type: array
          items: { type: string }

    JobAlert:
      type: object
      properties:
        id:         { type: integer, format: int64 }
        company:    { type: string }
        role:       { type: string }
        status:     { type: string, example: new }
        matchScore: { type: number, format: double, nullable: true, minimum: 0, maximum: 1 }
        jdText:     { type: string, nullable: true }
        createdAt:  { type: string, format: date-time }

    StarStory:
      type: object
      required: [title, tags]
      properties:
        id:        { type: integer, format: int64, readOnly: true, nullable: true }
        title:     { type: string, minLength: 1 }
        situation: { type: string, nullable: true }
        task:      { type: string, nullable: true }
        action:    { type: string, nullable: true }
        result:    { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
          description: |
            Send `[]` rather than omitting it. Omitting `tags` currently fails the
            `star_story.tags_json` NOT NULL constraint and surfaces as `500 INTERNAL`
            — a known bug, not a validation error.

    UsageSummary:
      type: object
      properties:
        monthUsd:     { type: number, format: double, description: Month-to-date spend. }
        budgetUsd:    { type: number, format: double }
        remainingUsd: { type: number, format: double, description: May be negative — budget never hard-blocks. }
        warning:      { type: boolean, description: '`monthUsd >= budgetUsd`. Calls now use the cheap tier.' }
