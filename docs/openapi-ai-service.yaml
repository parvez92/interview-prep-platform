# Generated from the live FastAPI app (GET /openapi.json), then hand-enriched.
# Regenerate: curl -s localhost:8000/openapi.json | <this script>
openapi: 3.1.0
info:
  title: prep-loop — ai-service (internal)
  version: 2.0.0
  description: "The brains: résumé parsing, plan generation, the content pipeline (narrative → depth →\n\
    support), RAG over pgvector, LangGraph agents, the mock interviewer, and scoring.\n\n**Internal only.**\
    \ No browser ever calls this service. Every request arrives from\nbackend-core's `AiClient`, authenticated\
    \ with a shared service token and carrying the\nacting user's id in a header. Never expose port 8000\
    \ publicly.\n\n### Contract with backend-core\n- `X-Service-Token` — shared secret from Vault. Required.\
    \ Mismatch → `401`.\n- `X-User-Id` — the acting user. Everything (cache, usage, vectors) is scoped\
    \ to it.\n- `X-Provider` / `X-Model` — optional overrides. Java's `BudgetGuard` also injects a\n \
    \ `model` field into the JSON body; when both are present the body wins.\n\n### Response envelope\n\
    Every model-backed endpoint returns `{result, meta}`. `meta.cached=true` means the\nanswer came from\
    \ `ai_cache` and cost nothing — the cache is checked before any paid\ncall, and every real call writes\
    \ a `usage_log` row.\n\n### Agents\n`/ai/agents/**` are bounded ReAct loops (max 3–6 steps, 30s deadline,\
    \ token cap,\nallow-listed tools, idempotent writes, one `agent_run` trace row). Their tools call\n\
    **back into backend-core's REST API** — the agents have no second data path, only\nlocal pgvector\
    \ search.\n\nThis file is generated from the live FastAPI app and hand-enriched. Regenerate with:\n\
    `curl -s localhost:8000/openapi.json`."
paths:
  /ai/parse-resume:
    post:
      tags:
      - parse
      summary: Extract skills, gaps, domains and experience from résumé text.
      operationId: parse_resume_ai_parse_resume_post
      parameters:
      - name: x-service-token
        in: header
        required: true
        schema:
          type: string
          title: X-Service-Token
      - name: x-user-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-User-Id
      - name: x-provider
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Provider
      - name: x-model
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Model
      - name: x-ollama-url
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Ollama-Url
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParseResumeRequest'
      responses:
        '200':
          description: Success. `meta.cached=true` means no model was called.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiEnvelope'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or wrong `X-Service-Token`.
