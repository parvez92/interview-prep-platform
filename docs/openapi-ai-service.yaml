          - type: string
          - type: 'null'
          title: X-Provider
      - name: x-model
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Model
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrepPackRequest'
      responses:
        '200':
          description: Success. `meta.cached=true` means no model was called.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiEnvelope'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Missing or wrong `X-Service-Token`.
  /ai/settings:
    get:
      tags:
      - settings
      summary: Resolved provider/model settings for the acting user.
      description: 'Returns available AI modes and connection details.

        The frontend settings page uses this to display mode options and MCP URLs.

        No auth required — purely informational.'
      operationId: get_ai_settings_ai_settings_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          description: Missing or wrong `X-Service-Token`.
        '422':
          description: Request body failed pydantic validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /health:
    get:
      summary: Liveness probe — the only unauthenticated route.
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security: []
