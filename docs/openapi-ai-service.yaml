      description: 'The density pass. Uses enumerate-then-compress (`_scratch` first, then compressed

        `points`), a per-category gold-standard exemplar, and RAG over already-generated cards

        so later weeks don''t re-teach earlier ones.


        `must_cover` makes this a **repair pass**: backend-core sends the scope terms a previous

        attempt dropped, and the prompt asks for exactly one card per dropped term. `must_cover`

        is part of the cache key, so a repair result is never served to a plain call.


        `regenerate: true` bypasses the cache — used for per-topic validation retries.'
